set -g status "on"
set -g status-justify "left"
set -g status-keys emacs
set -g status-left ""
set -g status-left-length "100"
set -g status-position bottom
set -g status-right " #S "
set -g status-right-length "40"

setw -g window-status-separator ""

# github-colorblind palette (dark) — see docs/colorschemes/github-colorblind.md
set -g status-style "bg=default,fg=#9198a1"
set -g pane-border-style "bg=default,fg=#3d444d"
set -g pane-active-border-style "bg=default,fg=#1f6feb"
setw -g window-status-format "#[bg=#212830,fg=#f0f6fc] #I #[bg=#151b23,fg=#f0f6fc] #{b:pane_current_path} "
setw -g window-status-current-format "#[bold,fg=#ffffff,bg=#1f6feb] #I #[bold,fg=#0d1117,bg=#58a6ff] #{b:pane_current_path} "
