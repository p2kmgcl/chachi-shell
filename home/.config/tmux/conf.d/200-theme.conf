set -g status "on"
set -g status-justify "left"
set -g status-keys emacs
set -g status-left ""
set -g status-left-length "100"
set -g status-position bottom
set -g status-right " #S "
set -g status-right-length "40"

setw -g window-status-separator ""

# tmux 3.8+: resolve these semantic colors per client's detected appearance.
# github-colorblind palette — see docs/colorschemes/github-colorblind.md
set -s theme detect
set -s light-theme-black '#1f2328'
set -s dark-theme-black '#c9d1d9'
set -s light-theme-white '#ffffff'
set -s dark-theme-white '#0d1117'
set -s light-theme-light-grey '#f6f8fa'
set -s dark-theme-light-grey '#151b23'
set -s light-theme-dark-grey '#eff2f5'
set -s dark-theme-dark-grey '#212830'
set -s light-theme-magenta '#d1d9e0'
set -s dark-theme-magenta '#3d444d'
set -s light-theme-yellow '#59636e'
set -s dark-theme-yellow '#9198a1'
set -s light-theme-blue '#0969da'
set -s dark-theme-blue '#58a6ff'
set -s light-theme-cyan '#218bff'
set -s dark-theme-cyan '#79c0ff'

set -g status-style "bg=default,fg=themeyellow"
set -g pane-border-style "bg=default,fg=thememagenta"
set -g pane-active-border-style "bg=default,fg=themeblue"
setw -g window-status-format "#[bg=themedarkgrey,fg=themeblack] #I #[bg=themelightgrey,fg=themeblack] #{b:pane_current_path} "
setw -g window-status-current-format "#[bold,fg=themewhite,bg=themeblue] #I #[bold,fg=themewhite,bg=themecyan] #{b:pane_current_path} "
