customCommands:
  - key: 'C'
    context: 'files'
    description: 'Commit with generated message'
    command: 'TMPFILE=$(mktemp) && ~/.config/git/global-hooks/prepare-commit-msg "$TMPFILE" && git commit --edit --file="$TMPFILE"; rm -f "$TMPFILE"'
    output: terminal
confirmOnQuit: false
os:
  editPreset: 'nvim-remote'
gui:
  sidePanelWidth: 0.2
  expandFocusedSidePanel: true
  showFileTree: true
  showBottomLine: false
  showCommandLog: false
  showRandomTip: false
  border: rounded
  nerdFontsVersion: '3'
  filterMode: fuzzy
  commitLength:
    show: true
  # github-colorblind palette (dark) — see docs/colorschemes/github-colorblind.md
  theme:
    activeBorderColor: ['#1f6feb', bold] # accent emphasis
    inactiveBorderColor: ['#3d444d'] # border default
    optionsTextColor: ['#4493f8'] # accent / link
    selectedLineBgColor: ['#111d2e'] # accent muted over default background
    selectedRangeBgColor: ['#111d2e']
    cherryPickedCommitFgColor: ['#4493f8'] # accent
    cherryPickedCommitBgColor: ['#111d2e']
    markedBaseCommitFgColor: ['#d29922'] # attention
    markedBaseCommitBgColor: ['#272215'] # attention muted over default background
    unstagedChangesColor: ['#f0883e'] # danger (orange)
    defaultFgColor: ['#f0f6fc'] # fg default
git:
  diffRenderers:
    - colorarg: always
      command: delta --paging=never --hunk-header-style=omit --file-decoration-style=ul
  mainBranches:
    - master
    - main
    - preprod
    - devel
  log:
    showGraph: always
    format: oneline
  branchLogCmd: git log --graph --color=always --pretty='%Cgreen%h %Cblue%an (%ar) %Creset%s' {{branchName}} --
  autoFetch: false
  fetchAll: true
  overrideGpg: true
  showWholeFileDiff: false
